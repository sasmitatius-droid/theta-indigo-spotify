name: 📰 Theta Indigo Afternoon Blog Generator

on:
  schedule:
    - cron: '0 11 * * *'    # 18:00 WIB (UTC 11:00) — Rilis Artikel Sore
  workflow_dispatch:

jobs:
  trigger-blog-generation:
    name: Trigger Blog Generation
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Trigger Blog Generator Endpoint
        run: |
          echo "Calling Blog Generator API..."
          curl -s -X POST "https://www.indigoblueprint.my.id/api/cron/generate-blog?secret=${{ secrets.CRON_SECRET }}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
